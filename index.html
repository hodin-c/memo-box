<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>나의 메모 상자</title>
<style>
  /* ===== 색깔 정하기 (밝은 화면 / 어두운 화면) ===== */
  :root {
    --bg: #f7f6f3; --panel: #ffffff; --text: #22211f; --muted: #7a776f;
    --line: #e4e1da; --accent: #2f6fde; --accent-soft: #e6eefc;
    --danger: #c9372c; --missing: #c9372c; --hover: #f0eee9;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #1a1a19; --panel: #232322; --text: #ecebe7; --muted: #9a978f;
      --line: #393835; --accent: #7aa7ff; --accent-soft: #2a3550;
      --danger: #ff7b6e; --missing: #ff8f84; --hover: #2c2c2a;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
    font-family: -apple-system, "Segoe UI", "Malgun Gothic", "Apple SD Gothic Neo", sans-serif; }
  button, select, input, textarea { font: inherit; color: inherit; }
  button { cursor: pointer; border: 1px solid var(--line); background: var(--panel);
    border-radius: 8px; padding: 6px 12px; }
  button:hover { background: var(--hover); }
  .primary { background: var(--accent); color: #fff; border-color: var(--accent); font-weight: 600; }
  .primary:hover { background: var(--accent); filter: brightness(1.1); }
  .danger { color: var(--danger); }
  .danger.armed { background: var(--danger); color: #fff; border-color: var(--danger); font-weight: 600; }
  .muted { color: var(--muted); font-size: 13px; }

  /* ===== 화면 배치: 왼쪽 목록 + 오른쪽 메모 ===== */
  /* minmax(0, …): 긴 글자가 있어도 칸이 화면보다 넓어지지 않게 해요 */
  .app { display: grid; grid-template-columns: 300px minmax(0, 1fr); height: 100vh; height: 100dvh; }
  .sidebar { min-width: 0; background: var(--panel); border-right: 1px solid var(--line);
    display: flex; flex-direction: column; gap: 10px; padding: 16px; min-height: 0; }
  .brand { font-size: 18px; font-weight: 700; }
  #search { width: 100%; padding: 8px 10px; border: 1px solid var(--line);
    border-radius: 8px; background: var(--bg); }
  .filters { display: flex; flex-wrap: wrap; gap: 4px; }
  .filters button { padding: 3px 9px; font-size: 13px; border-radius: 999px; }
  .filters button.active { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); }
  #list { list-style: none; margin: 0; padding: 0; overflow-y: auto; flex: 1; }
  #list li { padding: 9px 10px; border-radius: 8px; cursor: pointer; }
  #list li:hover { background: var(--hover); }
  #list li.active { background: var(--accent-soft); }
  #list .t { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #list .s { color: var(--muted); font-size: 12px; margin-top: 2px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .sidebar-foot { display: flex; gap: 6px; }
  .sidebar-foot > * { flex: 1; text-align: center; font-size: 13px; }
  .btn { border: 1px solid var(--line); border-radius: 8px; padding: 6px 12px; cursor: pointer; }
  .btn:hover { background: var(--hover); }
  .sync { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--muted);
    padding: 8px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); }
  .sync span { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .sync button { padding: 3px 9px; font-size: 12px; flex-shrink: 0; }

  main { overflow-y: auto; padding: 24px 32px; min-width: 0; }
  .wrap { max-width: 760px; margin: 0 auto; }
  #empty { text-align: center; margin-top: 20vh; color: var(--muted); }
  .toolbar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-bottom: 12px; }
  .toolbar .spacer { flex: 1; }
  select { border: 1px solid var(--line); border-radius: 8px; padding: 5px 8px; background: var(--panel); }
  .seg { display: inline-flex; }
  .seg button { border-radius: 0; }
  .seg button:first-child { border-radius: 8px 0 0 8px; }
  .seg button:last-child { border-radius: 0 8px 8px 0; }
  .seg button + button { border-left: none; }
  .seg button.on { background: var(--accent-soft); color: var(--accent); }
  #title { width: 100%; font-size: 26px; font-weight: 700; border: none; background: transparent;
    padding: 6px 0; outline: none; border-bottom: 1px solid var(--line); margin-bottom: 14px; }

  .editor-area { position: relative; }
  #content { width: 100%; min-height: 320px; resize: vertical; padding: 14px; line-height: 24px;
    font-size: 15px; border: 1px solid var(--line); border-radius: 10px; background: var(--panel); outline: none; }
  #content:focus { border-color: var(--accent); }
  .hint { margin: 6px 2px 0; }
  .preview { min-height: 120px; line-height: 1.7; font-size: 16px; }
  .preview h2, .preview h3, .preview h4 { margin: 18px 0 8px; }
  .preview p { margin: 0 0 10px; }
  .preview code { background: var(--hover); padding: 1px 5px; border-radius: 4px; }
  .wl { color: var(--accent); text-decoration: none; background: var(--accent-soft);
    padding: 0 4px; border-radius: 4px; }
  .wl.missing { color: var(--missing); background: transparent; border-bottom: 1px dashed var(--missing); border-radius: 0; }

  /* [[ 자동완성 목록 */
  .ac { position: absolute; z-index: 10; list-style: none; margin: 0; padding: 4px; width: 260px;
    background: var(--panel); border: 1px solid var(--line); border-radius: 8px;
    box-shadow: 0 6px 20px rgba(0,0,0,.15); }
  .ac li { padding: 6px 8px; border-radius: 6px; cursor: pointer; font-size: 14px; }
  .ac li.sel { background: var(--accent-soft); }

  .backlinks { margin-top: 32px; padding-top: 16px; border-top: 1px solid var(--line); }
  .backlinks h3 { font-size: 15px; margin: 0 0 10px; }
  #backlinks { list-style: none; padding: 0; margin: 0; display: grid; gap: 8px; }
  #backlinks li { padding: 10px 12px; border: 1px solid var(--line); border-radius: 8px;
    background: var(--panel); cursor: pointer; }
  #backlinks li:hover { border-color: var(--accent); }
  #backlinks .ctx { color: var(--muted); font-size: 13px; margin-top: 4px; }
  /* 마인드맵 */
  .map { border: 1px solid var(--line); border-radius: 10px; background: var(--panel); padding: 10px; }
  .map-bar { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin-bottom: 6px; }
  .map-bar button { padding: 3px 10px; font-size: 13px; border-radius: 999px; }
  .map-bar button.on { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); }
  .map-bar .sep { width: 1px; height: 20px; background: var(--line); margin: 0 4px; }
  .map-bar kbd { font: 11px/1 inherit; padding: 2px 4px; border: 1px solid var(--line); border-radius: 4px; margin-left: 4px; color: var(--muted); }
  #mapCanvas { position: relative; overflow: auto; max-height: 70vh; outline: none; border-radius: 8px; }
  #mapCanvas:focus-visible { box-shadow: inset 0 0 0 2px var(--accent-soft); }
  #mapCanvas svg { display: block; }
  .map-help { margin: 8px 2px 0; }
  .mm-edge { stroke: var(--muted); stroke-width: 1.5; fill: none; opacity: .55; }
  .mm-node { cursor: pointer; }
  .mm-node rect { fill: var(--panel); stroke-width: 1.5; }
  .mm-node:hover rect { fill: var(--hover); }
  .mm-node text { fill: var(--text); font-size: 13px; dominant-baseline: central; pointer-events: none; }
  .mm-node.root rect { fill: var(--accent); stroke: var(--accent); }
  .mm-node.root text { fill: var(--bg); font-size: 15px; font-weight: 700; }
  .mm-node.l1 rect { fill: var(--accent-soft); }
  .mm-node.sel rect { stroke: var(--accent); stroke-width: 3; }
  .mm-node.root.sel rect { stroke: var(--text); }
  .mm-node.missing rect { stroke: var(--missing); stroke-dasharray: 5 4; fill: var(--panel); }
  .mm-node.missing text { fill: var(--missing); }
  .mm-node.pending rect { stroke: var(--accent); stroke-dasharray: 5 4; }
  .mm-input { position: absolute; box-sizing: border-box; padding: 0 10px; font-size: 13px;
    border: 2px solid var(--accent); border-radius: 6px; background: var(--panel); outline: none; }
  .t-fleeting { stroke: #d9a514; } .t-literature { stroke: #2e9e5b; }
  .t-permanent { stroke: var(--accent); } .t-index { stroke: #9157d6; }
  #toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
    background: var(--text); color: var(--bg); padding: 8px 16px; border-radius: 8px;
    font-size: 14px; opacity: 0; transition: opacity .2s; pointer-events: none; }
  #toast.show { opacity: 1; pointer-events: auto; }
  #toast button { margin-left: 10px; padding: 2px 10px; background: transparent; color: inherit;
    border-color: currentColor; font-weight: 600; }
  .mobile-only { display: none; }

  /* ===== 핸드폰처럼 좁은 화면 ===== */
  @media (max-width: 760px) {
    .app { grid-template-columns: minmax(0, 1fr); }
    main { display: none; padding: 16px; }
    .app.show-main .sidebar { display: none; }
    .app.show-main main { display: block; }
    .mobile-only { display: inline-block; }
  }
</style>
</head>
<body>
<div class="app" id="app">
  <aside class="sidebar">
    <div class="brand">🗂️ 나의 메모 상자</div>
    <button id="newBtn" class="primary">+ 새 메모</button>
    <input id="search" type="search" placeholder="🔍 제목이나 내용으로 검색">
    <div class="filters" id="filters"></div>
    <ul id="list"></ul>
    <div class="sync" id="syncBox"><span id="syncText">☁️ 확인 중…</span><button id="syncBtn" hidden></button></div>
    <div class="sidebar-foot">
      <button id="exportBtn" title="메모 전체를 파일로 저장해요">⬇️ 내보내기</button>
      <label class="btn" title="저장해 둔 파일에서 메모를 불러와요">⬆️ 가져오기<input type="file" id="importInput" accept=".json,application/json" hidden></label>
    </div>
  </aside>

  <main>
    <div class="wrap">
      <div id="empty">
        <p style="font-size:40px;margin:0">🗂️</p>
        <p>왼쪽에서 메모를 고르거나 <b>+ 새 메모</b>를 눌러 보세요.</p>
      </div>
      <div id="editor" hidden>
        <div class="toolbar">
          <button id="backBtn" class="mobile-only">← 목록</button>
          <select id="typeSel" title="메모 종류"></select>
          <div class="seg">
            <button id="editTab">✏️ 쓰기</button><button id="viewTab">👀 보기</button><button id="mapTab">🗺️ 마인드맵</button>
          </div>
          <span class="spacer"></span>
          <span id="saveState" class="muted"></span>
          <button id="deleteBtn" class="danger">삭제</button>
        </div>
        <input id="title" placeholder="제목: 생각 하나를 한 문장으로" autocomplete="off">
        <div class="editor-area">
          <textarea id="content" placeholder="여기에 생각을 적어 보세요.&#10;다른 메모와 연결하려면 [[ 를 입력하세요."></textarea>
          <ul id="ac" class="ac" hidden></ul>
          <p id="hint" class="muted hint">💡 <b>[[</b> 를 치면 다른 메모 이름이 나와요. <b>**굵게**</b>, <b># 제목</b>, <b>- 목록</b>도 쓸 수 있어요.</p>
          <div id="preview" class="preview" hidden></div>
          <div id="map" class="map" hidden>
            <div class="map-bar">
              <span class="muted">펼칠 단계</span>
              <button data-depth="1">1</button><button data-depth="2">2</button><button data-depth="3">3</button><button data-depth="4">4</button>
              <span class="sep"></span>
              <button data-act="child">➕ 하위 메모<kbd>Tab</kbd></button>
              <button data-act="sibling">➕ 같은 단계<kbd>Enter</kbd></button>
              <button data-act="rename">✏️ 이름<kbd>F2</kbd></button>
              <button data-act="center">🎯 맨 앞으로</button>
              <button data-act="open">📄 내용 보기</button>
            </div>
            <div id="mapCanvas" tabindex="0"></div>
            <p class="muted map-help">클릭: 고르기 · 더블클릭: 그 메모 쓰기 화면으로 · 방향키: 옮겨 다니기 · 새 이름을 적다가 Tab을 누르면 바로 그 아래 메모를 또 만들어요</p>
          </div>
        </div>
        <p id="noteMeta" class="muted"></p>
        <section class="backlinks">
          <h3>🔙 이 메모를 가리키는 메모들</h3>
          <ul id="backlinks"></ul>
        </section>
      </div>
    </div>
  </main>
</div>
<div id="toast"></div>

<script>
// =====================================================
//  1. 기본 설정
// =====================================================
const STORAGE_KEY = 'memo-box-notes-v1';   // 브라우저 창고에 붙이는 이름표
const TYPES = {
  fleeting:   { label: '임시', icon: '💭' },
  literature: { label: '문헌', icon: '📚' },
  permanent:  { label: '영구', icon: '💎' },
  index:      { label: '목차', icon: '🧭' },
};
const LINK_RE = /\[\[([^\[\]\n]+?)\]\]/g;    // [[메모 제목]] 을 찾는 규칙

const $ = id => document.getElementById(id);
let notes = loadNotes();
let currentId = null;
let filter = 'all';
let mode = 'edit';
let titleBeforeEdit = '';

// =====================================================
//  2. 저장하기 / 불러오기 (브라우저 안의 작은 창고)
// =====================================================
function loadNotes() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw !== null) return JSON.parse(raw);
  } catch (e) { /* 창고를 못 열면 예시 메모로 시작 */ }
  return sampleNotes();
}

let saveTimer = null;
function saveSoon() {
  $('saveState').textContent = '저장 중…';
  clearTimeout(saveTimer);
  saveTimer = setTimeout(saveNow, 400);
}
function saveNow() {
  clearTimeout(saveTimer);
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(notes));
    $('saveState').textContent = '저장됨 ✓';
  } catch (e) {
    $('saveState').textContent = '⚠️ 저장 실패 — 내보내기로 백업하세요';
  }
  pushChanges();   // 로그인해 있으면 바뀐 메모를 인터넷 창고에도 올려요
}

// 처음 열었을 때 보여 줄 예시 메모
function sampleNotes() {
  // 날짜를 고정해 둬요. 새 기기의 예시 메모가 다른 기기에서 고친 메모보다 "더 최신"으로 착각되지 않게요
  const now = new Date('2026-10-24T09:00:00').getTime();
  return [
    { id: '20261024090000', type: 'index', title: '사용법',
      content: '# 나의 메모 상자에 오신 걸 환영해요!\n\n' +
        '- 메모 하나에는 **생각 하나만** 적어요.\n' +
        '- 다른 메모와 연결하려면 [[ 를 치고 제목을 골라요.\n' +
        '- 메모 아래쪽 🔙 칸에서 **이 메모를 가리키는 메모들**을 볼 수 있어요.\n' +
        '- 빨간 점선 링크는 아직 없는 메모예요. 누르면 새로 만들어져요: [[아직 없는 메모]]\n\n' +
        '## 예시 메모 둘러보기\n- [[광합성]]\n- [[식물도 잠을 잘까?]]',
      created: now - 4000, updated: now - 4000 },
    { id: '20261024090100', type: 'permanent', title: '광합성',
      content: '식물이 **빛 에너지**로 물과 이산화탄소에서 양분(포도당)을 만드는 과정.\n\n이 일은 [[엽록체]]에서 일어난다.',
      created: now - 3000, updated: now - 3000 },
    { id: '20261024090200', type: 'permanent', title: '엽록체',
      content: '식물 세포 안에 있는 초록색 알갱이. 초록색인 이유는 엽록소 때문이다.',
      created: now - 2000, updated: now - 2000 },
    { id: '20261024090300', type: 'fleeting', title: '식물도 잠을 잘까?',
      content: '버스에서 든 생각. 밤에는 빛이 없으니까 [[광합성]]을 못 할 텐데, 그럼 식물은 밤에 뭘 할까?',
      created: now - 1000, updated: now - 1000 },
  ];
}

// =====================================================
//  3. 메모 다루기 도우미
// =====================================================
// 고유 번호 만들기: 2026년 10월 24일 15시 30분 05초 → 20261024153005
function makeId() {
  const d = new Date(), p = n => String(n).padStart(2, '0');
  let id = `${d.getFullYear()}${p(d.getMonth() + 1)}${p(d.getDate())}${p(d.getHours())}${p(d.getMinutes())}${p(d.getSeconds())}`;
  while (notes.some(n => n.id === id)) id = String(Number(id) + 1);   // 겹치면 1 더하기
  return id;
}
const sameTitle = (a, b) => a.trim().toLowerCase() === b.trim().toLowerCase();
const findByTitle = t => notes.find(n => n.title && sameTitle(n.title, t));
const getNote = id => notes.find(n => n.id === id);

// 메모 안에 있는 [[링크]] 제목들 꺼내기
function linksIn(note) {
  return [...note.content.matchAll(LINK_RE)].map(m => m[1].trim());
}
// 이 메모를 가리키는 다른 메모들 (백링크)
function backlinksOf(note) {
  if (!note.title.trim()) return [];
  return notes.filter(n => n.id !== note.id && linksIn(n).some(t => sameTitle(t, note.title)));
}

function createNote(title = '', type = 'fleeting') {
  const note = { id: makeId(), type, title, content: '', created: Date.now(), updated: Date.now() };
  notes.push(note);
  saveNow();
  return note;
}

// =====================================================
//  4. 왼쪽 목록 그리기
// =====================================================
function renderFilters() {
  const count = t => t === 'all' ? notes.length : notes.filter(n => n.type === t).length;
  const items = [['all', '전체'], ...Object.entries(TYPES).map(([k, v]) => [k, `${v.icon} ${v.label}`])];
  $('filters').innerHTML = items.map(([k, label]) =>
    `<button data-type="${k}" class="${filter === k ? 'active' : ''}">${label} ${count(k)}</button>`).join('');
}

function renderList() {
  renderFilters();
  const q = $('search').value.trim().toLowerCase();
  const shown = notes
    .filter(n => filter === 'all' || n.type === filter)
    .filter(n => !q || n.title.toLowerCase().includes(q) || n.content.toLowerCase().includes(q))
    .sort((a, b) => b.updated - a.updated);

  if (!shown.length) {
    $('list').innerHTML = `<li class="muted" style="cursor:default">${q ? '찾는 메모가 없어요' : '메모가 없어요'}</li>`;
    return;
  }
  $('list').innerHTML = shown.map(n => {
    let snippet = n.content.split('\n').find(l => l.trim()) || '';
    if (q) {   // 검색 중이면 찾은 단어 주변 글을 보여 주기
      const i = n.content.toLowerCase().indexOf(q);
      if (i >= 0) snippet = '…' + n.content.slice(Math.max(0, i - 15), i + 40).replace(/\n/g, ' ');
    }
    return `<li data-id="${n.id}" class="${n.id === currentId ? 'active' : ''}">
      <div class="t">${TYPES[n.type].icon} ${esc(n.title) || '<span class="muted">(제목 없음)</span>'}</div>
      <div class="s">${esc(snippet)}</div></li>`;
  }).join('');
}

// =====================================================
//  5. 메모 열기 / 오른쪽 화면 그리기
// =====================================================
function openNote(id, startMode) {
  const note = getNote(id);
  if (!note) return;
  currentId = id;
  mapEdit = null;
  mapSel = id;
  resetDeleteBtn();
  $('empty').hidden = true;
  $('editor').hidden = false;
  $('title').value = note.title;
  $('content').value = note.content;
  $('typeSel').value = note.type;
  $('saveState').textContent = '';
  setMode(startMode || (mode === 'map' ? 'map' : note.content.trim() ? 'view' : 'edit'));
  renderMeta();
  renderBacklinks();
  renderList();
  $('app').classList.add('show-main');
  document.querySelector('main').scrollTop = 0;
}

function closeNote() {
  currentId = null;
  $('editor').hidden = true;
  $('empty').hidden = false;
  $('app').classList.remove('show-main');
  renderList();
}

function setMode(m) {
  mode = m;
  $('editTab').classList.toggle('on', m === 'edit');
  $('viewTab').classList.toggle('on', m === 'view');
  $('content').hidden = m !== 'edit';
  $('hint').hidden = m !== 'edit';
  $('mapTab').classList.toggle('on', m === 'map');
  $('preview').hidden = m !== 'view';
  $('map').hidden = m !== 'map';
  hideAC();
  if (m === 'edit') $('content').value = getNote(currentId).content;   // 마인드맵에서 바뀐 내용 반영
  if (m === 'view') $('preview').innerHTML = renderMarkdown(getNote(currentId).content);
  if (m === 'map') renderMap();
}

// =====================================================
//  마인드맵: 지금 메모를 맨 왼쪽에 두고, 연결된 메모를 오른쪽으로 가지처럼 펼치기
// =====================================================
let mapDepth = 2;
let mapSel = null;    // 지금 골라 둔 메모
let mapEdit = null;   // 이름을 적는 중이면 { kind: 'new', parentId } 또는 { kind: 'rename', id }
let mapTree = null;   // 마지막으로 그린 나무 모양 (방향키 이동에 써요)
const ROW = 46, COL_GAP = 56, PAD = 24;

// 이 메모와 연결된 메모들 (내가 가리키는 메모 + 나를 가리키는 메모)
function neighborsOf(note) {
  const ids = new Set();
  for (const t of linksIn(note)) {
    const n = findByTitle(t);
    if (n && n.id !== note.id) ids.add(n.id);
  }
  for (const n of backlinksOf(note)) ids.add(n.id);
  return [...ids];
}

function renderMap() {
  document.querySelectorAll('.map-bar [data-depth]').forEach(b => b.classList.toggle('on', Number(b.dataset.depth) === mapDepth));
  const root = getNote(currentId);

  // 1) 맨 앞 메모에서 한 칸씩 퍼져 나가며 나무 모양 만들기 (몇 번째 칸인지 = 단계)
  const level = new Map([[root.id, 0]]), parent = new Map(), children = new Map([[root.id, []]]);
  const addChild = (p, id, l) => { level.set(id, l); parent.set(id, p); children.get(p).push(id); children.set(id, []); };
  let frontier = [root.id];
  for (let d = 1; d <= mapDepth; d++) {
    const next = [];
    for (const id of frontier) {
      const note = getNote(id);
      for (const nb of neighborsOf(note)) if (!level.has(nb)) { addChild(id, nb, d); next.push(nb); }
      // 아직 없는 메모로 가는 링크는 빨간 점선 상자로
      for (const t of new Set(linksIn(note).filter(t => !findByTitle(t)))) addChild(id, `missing:${id}|${t}`, d);
    }
    frontier = next;
  }
  if (mapEdit?.kind === 'new' && children.has(mapEdit.parentId)) {
    addChild(mapEdit.parentId, 'pending', level.get(mapEdit.parentId) + 1);   // 이름을 적는 중인 새 상자
  }
  if (!level.has(mapSel)) mapSel = root.id;

  // 2) 상자마다 글자와 크기 정하기
  const info = new Map();
  for (const id of level.keys()) {
    const n = getNote(id), isRoot = id === root.id;
    const full = id === 'pending' ? '' : n ? (n.title.trim() || '(제목 없음)') : id.slice(id.indexOf('|') + 1);
    const label = full.length > 18 ? full.slice(0, 17) + '…' : full;
    const icon = n ? TYPES[n.type].icon + ' ' : '';
    const w = id === 'pending' ? 180 : Math.min(280, 26 + (n ? 20 : 0) + label.length * (isRoot ? 16 : 13.5));
    info.set(id, { n, full, label, icon, w, h: isRoot ? 44 : 32 });
  }

  // 3) 자리 정하기: 단계마다 오른쪽으로 한 줄씩, 가지 끝 메모는 위에서 아래로 차례차례
  const colW = [];
  for (const [id, l] of level) colW[l] = Math.max(colW[l] || 0, info.get(id).w);
  const colX = [PAD];
  for (let l = 1; l < colW.length; l++) colX[l] = colX[l - 1] + colW[l - 1] + COL_GAP;
  const pos = new Map();
  let nextY = PAD;
  (function place(id) {
    const kids = children.get(id);
    let y;
    if (!kids.length) { y = nextY + ROW / 2; nextY += ROW; }
    else { kids.forEach(place); y = (pos.get(kids[0]).y + pos.get(kids[kids.length - 1]).y) / 2; }   // 자식들의 한가운데
    pos.set(id, { x: colX[level.get(id)], y });
  })(root.id);

  // 4) 꺾인 선 그리기: 부모 오른쪽 → 가운데에서 꺾어서 → 자식 왼쪽
  const edges = [];
  for (const [p, kids] of children) {
    const a = pos.get(p), x1 = a.x + info.get(p).w, mx = x1 + COL_GAP / 2;
    for (const k of kids) {
      const b = pos.get(k);
      edges.push(`<path class="mm-edge" d="M${x1} ${a.y} H${mx} V${b.y} H${b.x}"/>`);
    }
  }

  // 5) 상자 그리기
  const boxes = [...pos].map(([id, p]) => {
    const i = info.get(id), l = level.get(id);
    const cls = ['mm-node', id === root.id && 'root', l === 1 && 'l1', id === mapSel && 'sel',
      !i.n && id !== 'pending' && 'missing', id === 'pending' && 'pending'].filter(Boolean).join(' ');
    return `<g class="${cls}" data-id="${esc(id)}">
      <title>${esc(i.full)}${i.n || id === 'pending' ? '' : ' (아직 없는 메모 · 더블클릭하면 만들어져요)'}</title>
      <rect class="${i.n ? 't-' + i.n.type : ''}" x="${p.x}" y="${p.y - i.h / 2}" width="${i.w}" height="${i.h}" rx="6"/>
      <text x="${p.x + 12}" y="${p.y}">${i.icon}${esc(i.label)}</text></g>`;
  });
  const width = colX[colX.length - 1] + colW[colW.length - 1] + PAD;
  const lonely = pos.size === 1
    ? `<text x="${PAD + info.get(root.id).w + 20}" y="${PAD + ROW / 2}" fill="var(--muted)" font-size="14" dominant-baseline="central">← Tab 을 눌러 첫 하위 메모를 만들어 보세요</text>` : '';
  const canvas = $('mapCanvas');
  canvas.innerHTML = `<svg width="${width + (lonely ? 340 : 0)}" height="${nextY + PAD}">${edges.join('')}${boxes.join('')}${lonely}</svg>`;
  mapTree = { level, parent, children };

  // 6) 이름을 적는 중이면 상자 위에 입력칸 띄우기
  if (mapEdit) {
    const edit = mapEdit, id = edit.kind === 'new' ? 'pending' : edit.id;
    const p = pos.get(id), i = info.get(id);
    const input = document.createElement('input');
    input.className = 'mm-input';
    input.placeholder = '새 메모 제목';
    input.value = edit.kind === 'rename' ? getNote(id).title : '';
    Object.assign(input.style, { left: p.x + 'px', top: (p.y - i.h / 2) + 'px', width: Math.max(200, i.w) + 'px', height: i.h + 'px' });
    canvas.appendChild(input);
    input.focus();
    input.select();
    input.scrollIntoView({ block: 'nearest', inline: 'nearest' });
    input.addEventListener('keydown', e => {
      if (e.isComposing || e.keyCode === 229) return;   // 한글을 조합하는 중에는 무시
      if (e.key === 'Enter') { e.preventDefault(); finishMapEdit(edit, input.value); }
      else if (e.key === 'Tab' && !e.shiftKey) { e.preventDefault(); finishMapEdit(edit, input.value, true); }
      else if (e.key === 'Escape') { e.preventDefault(); finishMapEdit(edit, ''); }
    });
    input.addEventListener('blur', () => finishMapEdit(edit, input.value));
  } else {
    canvas.querySelector('.mm-node.sel')?.scrollIntoView({ block: 'nearest', inline: 'nearest' });
  }
}

function focusMap() { if (!mapEdit) $('mapCanvas').focus({ preventScroll: true }); }

// 고르기만 할 때는 다시 그리지 않고 테두리만 바꿔요
// (다시 그리면 상자가 새로 바뀌어서 두 번째 클릭이 더블클릭으로 인식되지 않아요)
function selectNode(id) {
  mapSel = id;
  document.querySelectorAll('#mapCanvas .mm-node').forEach(g => g.classList.toggle('sel', g.dataset.id === id));
  document.querySelector('#mapCanvas .mm-node.sel')?.scrollIntoView({ block: 'nearest', inline: 'nearest' });
  focusMap();
}

// 빨간 점선(아직 없는 메모)이면 진짜 메모로 만들고 그 번호를 돌려줘요
function realize(id) {
  if (!id.startsWith('missing:')) return id;
  const title = id.slice(id.indexOf('|') + 1);
  const note = findByTitle(title) || createNote(title, 'fleeting');
  renderList();
  return note.id;
}

function startChild(id) {
  const l = mapTree.level.get(id) ?? 0;
  id = realize(id);
  mapDepth = Math.max(mapDepth, l + 1);   // 새 메모가 보이도록 단계를 늘려요
  mapSel = id;
  mapEdit = { kind: 'new', parentId: id };
  renderMap();
}
function startSibling(id) {
  if (id === currentId) return startChild(id);   // 맨 앞 메모는 형제가 없으니 하위 메모로
  startChild(mapTree.parent.get(id));
}
function startRename(id) {
  id = realize(id);
  mapSel = id;
  mapEdit = { kind: 'rename', id };
  renderMap();
}

function finishMapEdit(edit, text, thenChild) {
  if (mapEdit !== edit) return;   // 이미 끝난 입력이면 무시
  mapEdit = null;
  text = text.trim();
  let made = false;
  if (edit.kind === 'new' && text) {
    const parentNote = getNote(edit.parentId);
    let child = findByTitle(text);
    if (child && child.id === parentNote.id) toast('자기 자신을 하위 메모로 넣을 수는 없어요');
    else {
      if (!child) child = createNote(text, 'fleeting');
      // 부모 메모 내용 맨 끝에 "- [[새 메모]]" 를 적어서 연결해요
      if (!linksIn(parentNote).some(t => sameTitle(t, text))) {
        parentNote.content = parentNote.content.replace(/\s+$/, '') + (parentNote.content.trim() ? '\n' : '') + `- [[${child.title}]]`;
        parentNote.updated = Date.now();
      }
      mapSel = child.id;
      made = true;
    }
  } else if (edit.kind === 'rename' && text) {
    const note = getNote(edit.id), other = findByTitle(text);
    if (other && other.id !== note.id) toast('같은 제목의 메모가 이미 있어요');
    else if (text !== note.title) {
      const changed = relinkTitle(note.title, text, note.id);
      note.title = text;
      note.updated = Date.now();
      if (changed) toast(`다른 메모에 있던 연결 ${changed}개도 새 제목으로 바꿨어요`);
    }
  }
  saveNow();
  $('title').value = getNote(currentId).title;
  renderList();
  renderBacklinks();
  renderMap();
  if (thenChild && made) return startChild(mapSel);   // 적자마자 Tab → 바로 그 아래 메모 만들기
  focusMap();
}

$('map').addEventListener('mousedown', e => {
  if (e.target.closest('.map-bar button')) e.preventDefault();   // 버튼을 눌러도 마인드맵에서 키보드를 계속 쓸 수 있게
});
$('map').addEventListener('click', e => {
  const depthBtn = e.target.closest('[data-depth]');
  if (depthBtn) { mapDepth = Number(depthBtn.dataset.depth); renderMap(); return focusMap(); }
  const act = e.target.closest('[data-act]')?.dataset.act;
  if (act === 'child') return startChild(mapSel);
  if (act === 'sibling') return startSibling(mapSel);
  if (act === 'rename') return startRename(mapSel);
  if (act === 'center') return openNote(realize(mapSel), 'map');
  if (act === 'open') return openNote(realize(mapSel), 'view');
  const node = e.target.closest('.mm-node');
  if (node && node.dataset.id !== 'pending') selectNode(node.dataset.id);
});
$('map').addEventListener('dblclick', e => {
  const node = e.target.closest('.mm-node');
  if (!node || node.dataset.id === 'pending') return;
  openNote(realize(node.dataset.id), 'edit');   // 더블클릭 → 그 메모의 쓰기 화면으로
  $('content').focus();
});
$('mapCanvas').addEventListener('keydown', e => {
  if (mapEdit || e.target !== $('mapCanvas') || e.isComposing) return;
  const t = mapTree, id = mapSel;
  const sibs = id === currentId ? [id] : t.children.get(t.parent.get(id));
  if (e.key === 'Tab' && !e.shiftKey) startChild(id);
  else if (e.key === 'Enter') startSibling(id);
  else if (e.key === 'F2') startRename(id);
  else if (e.key === 'ArrowLeft' && t.parent.has(id)) selectNode(t.parent.get(id));
  else if (e.key === 'ArrowRight' && t.children.get(id)?.length) { const k = t.children.get(id); selectNode(k[Math.floor((k.length - 1) / 2)]); }
  else if (e.key === 'ArrowUp' && sibs.indexOf(id) > 0) selectNode(sibs[sibs.indexOf(id) - 1]);
  else if (e.key === 'ArrowDown' && sibs.indexOf(id) < sibs.length - 1) selectNode(sibs[sibs.indexOf(id) + 1]);
  else if (!['ArrowLeft', 'ArrowRight', 'ArrowUp', 'ArrowDown'].includes(e.key)) return;
  e.preventDefault();
});

function renderMeta() {
  const n = getNote(currentId);
  const f = t => new Date(t).toLocaleString('ko-KR', { dateStyle: 'medium', timeStyle: 'short' });
  $('noteMeta').textContent = `번호 ${n.id} · 만든 날 ${f(n.created)} · 고친 날 ${f(n.updated)}`;
}

function renderBacklinks() {
  const note = getNote(currentId);
  const list = backlinksOf(note);
  if (!list.length) {
    $('backlinks').innerHTML = '<li class="muted" style="cursor:default">아직 이 메모를 가리키는 메모가 없어요. 다른 메모에서 [[' + esc(note.title || '이 메모 제목') + ']] 이라고 적어 보세요.</li>';
    return;
  }
  $('backlinks').innerHTML = list.map(n => {
    // 링크가 들어 있는 줄을 함께 보여 주기
    const line = n.content.split('\n').find(l => linksIn({ content: l }).some(t => sameTitle(t, note.title))) || '';
    return `<li data-id="${n.id}"><b>${TYPES[n.type].icon} ${esc(n.title) || '(제목 없음)'}</b>
      <div class="ctx">${esc(line.trim())}</div></li>`;
  }).join('');
}

// =====================================================
//  6. 간단한 글 꾸미기 (마크다운 → 화면)
// =====================================================
function esc(s) {
  return String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}
function fmt(s) {
  return esc(s)
    .replace(/`([^`]+)`/g, '<code>$1</code>')
    .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
}
function inline(raw) {
  let out = '', last = 0;
  for (const m of raw.matchAll(LINK_RE)) {
    const t = m[1].trim();
    out += fmt(raw.slice(last, m.index));
    out += `<a href="#" class="wl${findByTitle(t) ? '' : ' missing'}" data-title="${esc(t)}"
      title="${findByTitle(t) ? '눌러서 이동' : '아직 없는 메모예요. 누르면 만들어져요'}">${esc(t)}</a>`;
    last = m.index + m[0].length;
  }
  return out + fmt(raw.slice(last));
}
function renderMarkdown(md) {
  let html = '', inList = false;
  for (const line of md.split('\n')) {
    const item = line.match(/^\s*[-*]\s+(.*)$/);
    if (item) {
      if (!inList) { html += '<ul>'; inList = true; }
      html += `<li>${inline(item[1])}</li>`;
      continue;
    }
    if (inList) { html += '</ul>'; inList = false; }
    const h = line.match(/^(#{1,3})\s+(.*)$/);
    if (h) html += `<h${h[1].length + 1}>${inline(h[2])}</h${h[1].length + 1}>`;
    else if (line.trim()) html += `<p>${inline(line)}</p>`;
  }
  if (inList) html += '</ul>';
  return html || '<p class="muted">내용이 없어요. ✏️ 쓰기를 눌러 적어 보세요.</p>';
}

// =====================================================
//  7. [[ 자동완성
// =====================================================
let acItems = [], acIndex = 0, acQuery = '';

function checkAC() {
  const ta = $('content');
  const before = ta.value.slice(0, ta.selectionStart);
  const m = before.match(/\[\[([^\[\]\n]*)$/);
  if (!m) return hideAC();
  acQuery = m[1];
  const q = acQuery.trim().toLowerCase();
  acItems = notes
    .filter(n => n.id !== currentId && n.title.trim() && n.title.toLowerCase().includes(q))
    .slice(0, 8)
    .map(n => ({ title: n.title, label: `${TYPES[n.type].icon} ${esc(n.title)}` }));
  if (q && !findByTitle(acQuery)) acItems.push({ title: acQuery.trim(), label: `➕ "${esc(acQuery.trim())}" 새 메모로 연결` });
  if (!acItems.length) return hideAC();
  acIndex = 0;
  drawAC();
  const { x, y } = caretXY(ta);
  const box = $('ac');
  box.style.left = Math.max(0, Math.min(x, ta.clientWidth - 260)) + 'px';
  box.style.top = (y + 6) + 'px';
  box.hidden = false;
}
function drawAC() {
  $('ac').innerHTML = acItems.map((it, i) => `<li data-i="${i}" class="${i === acIndex ? 'sel' : ''}">${it.label}</li>`).join('');
}
function hideAC() { $('ac').hidden = true; acItems = []; }
function pickAC(i) {
  const ta = $('content'), pos = ta.selectionStart;
  const start = pos - acQuery.length;
  const closeAlready = ta.value.slice(pos, pos + 2) === ']]';
  const insert = acItems[i].title + ']]';
  ta.value = ta.value.slice(0, start) + insert + ta.value.slice(closeAlready ? pos + 2 : pos);
  ta.selectionStart = ta.selectionEnd = start + insert.length;
  hideAC();
  ta.focus();
  onContentChange();
}
// 글자 커서가 화면 어디에 있는지 계산하기 (보이지 않는 복사본을 만들어서 재 봐요)
function caretXY(ta) {
  const div = document.createElement('div'), cs = getComputedStyle(ta);
  for (const p of ['fontFamily', 'fontSize', 'fontWeight', 'lineHeight', 'letterSpacing', 'paddingTop',
    'paddingLeft', 'paddingRight', 'borderTopWidth', 'borderLeftWidth', 'boxSizing', 'width']) div.style[p] = cs[p];
  Object.assign(div.style, { position: 'absolute', visibility: 'hidden', whiteSpace: 'pre-wrap', overflowWrap: 'break-word', top: 0, left: 0 });
  div.textContent = ta.value.slice(0, ta.selectionStart);
  const mark = document.createElement('span');
  mark.textContent = '​';
  div.appendChild(mark);
  document.body.appendChild(div);
  const x = mark.offsetLeft, y = mark.offsetTop + mark.offsetHeight - ta.scrollTop;
  div.remove();
  return { x, y };
}

// =====================================================
//  8. 버튼·입력에 반응하기
// =====================================================
function touch(note) { note.updated = Date.now(); saveSoon(); renderList(); renderMeta(); }

function onContentChange() {
  const note = getNote(currentId);
  note.content = $('content').value;
  touch(note);
}

$('content').addEventListener('input', () => { onContentChange(); checkAC(); });
$('content').addEventListener('click', checkAC);
$('content').addEventListener('blur', () => setTimeout(hideAC, 150));
$('content').addEventListener('keydown', e => {
  if ($('ac').hidden) return;
  if (e.key === 'ArrowDown') { acIndex = (acIndex + 1) % acItems.length; drawAC(); e.preventDefault(); }
  else if (e.key === 'ArrowUp') { acIndex = (acIndex - 1 + acItems.length) % acItems.length; drawAC(); e.preventDefault(); }
  else if (e.key === 'Enter' || e.key === 'Tab') { pickAC(acIndex); e.preventDefault(); }
  else if (e.key === 'Escape') { hideAC(); e.preventDefault(); }
});
$('ac').addEventListener('mousedown', e => {
  const li = e.target.closest('li');
  if (li) { e.preventDefault(); pickAC(Number(li.dataset.i)); }
});

$('title').addEventListener('focus', () => { titleBeforeEdit = getNote(currentId).title; });
$('title').addEventListener('input', () => {
  const note = getNote(currentId);
  note.title = $('title').value;
  touch(note);
});
// 제목을 바꾸면, 다른 메모에 있던 [[옛 제목]] 링크도 함께 바꿔 주기
function relinkTitle(oldT, newT, exceptId) {
  let changed = 0;
  for (const n of notes) {
    if (n.id === exceptId) continue;
    const updated = n.content.replace(LINK_RE, (m, t) => sameTitle(t, oldT) ? (changed++, `[[${newT.trim()}]]`) : m);
    if (updated !== n.content) { n.content = updated; n.updated = Date.now(); }
  }
  return changed;
}
$('title').addEventListener('change', () => {
  const note = getNote(currentId);
  const oldT = titleBeforeEdit.trim(), newT = note.title.trim();
  if (!oldT || !newT || oldT === newT) return;
  const changed = relinkTitle(oldT, newT, note.id);
  titleBeforeEdit = newT;
  if (changed) { saveNow(); renderList(); toast(`다른 메모에 있던 연결 ${changed}개도 새 제목으로 바꿨어요`); }
  renderBacklinks();
});

$('typeSel').innerHTML = Object.entries(TYPES).map(([k, v]) => `<option value="${k}">${v.icon} ${v.label} 메모</option>`).join('');
$('typeSel').addEventListener('change', () => {
  const note = getNote(currentId);
  note.type = $('typeSel').value;
  touch(note);
});

$('editTab').addEventListener('click', () => { setMode('edit'); $('content').focus(); });
$('viewTab').addEventListener('click', () => { saveNow(); setMode('view'); renderBacklinks(); });
$('mapTab').addEventListener('click', () => { saveNow(); setMode('map'); renderBacklinks(); focusMap(); });

// 보기 화면에서 링크 누르기 → 그 메모로 이동 (없으면 새로 만들기)
$('preview').addEventListener('click', e => {
  const a = e.target.closest('.wl');
  if (!a) return;
  e.preventDefault();
  const target = findByTitle(a.dataset.title) || createNote(a.dataset.title, 'fleeting');
  openNote(target.id);
});

$('backlinks').addEventListener('click', e => {
  const li = e.target.closest('li[data-id]');
  if (li) openNote(li.dataset.id);
});
$('list').addEventListener('click', e => {
  const li = e.target.closest('li[data-id]');
  if (li) openNote(li.dataset.id);
});
$('filters').addEventListener('click', e => {
  const b = e.target.closest('button');
  if (b) { filter = b.dataset.type; renderList(); }
});
$('search').addEventListener('input', renderList);

$('newBtn').addEventListener('click', () => {
  const note = createNote('', filter in TYPES ? filter : 'fleeting');
  $('search').value = '';
  openNote(note.id, 'edit');
  $('title').focus();
});
$('backBtn').addEventListener('click', closeNote);

// 삭제는 두 번 눌러야 돼요: 첫 번째는 "정말요?" 확인, 두 번째에 진짜 삭제
// (브라우저의 확인 창은 막혀 있는 곳이 있어서 앱 안에서 직접 물어봐요)
let deleteTimer = null;
function resetDeleteBtn() {
  clearTimeout(deleteTimer);
  $('deleteBtn').classList.remove('armed');
  $('deleteBtn').textContent = '삭제';
}
$('deleteBtn').addEventListener('click', () => {
  const btn = $('deleteBtn');
  if (!btn.classList.contains('armed')) {
    btn.classList.add('armed');
    btn.textContent = '정말 지울까요? 한 번 더 누르기';
    deleteTimer = setTimeout(resetDeleteBtn, 3000);   // 3초 안에 안 누르면 원래대로
    return;
  }
  resetDeleteBtn();
  const note = getNote(currentId);
  const index = notes.indexOf(note);
  notes = notes.filter(n => n.id !== note.id);
  saveNow();
  closeNote();
  toast('메모를 지웠어요', '되돌리기', () => {
    notes.splice(index, 0, note);
    saveNow();
    openNote(note.id);
    toast('메모를 되살렸어요');
  });
});

// =====================================================
//  9. 내보내기 / 가져오기 (다른 기기로 옮길 때)
// =====================================================
$('exportBtn').addEventListener('click', () => {
  saveNow();
  const blob = new Blob([JSON.stringify(notes, null, 2)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `메모상자-백업-${makeId().slice(0, 8)}.json`;
  a.click();
  URL.revokeObjectURL(a.href);
  toast(`메모 ${notes.length}개를 파일로 저장했어요`);
});

$('importInput').addEventListener('change', async e => {
  const file = e.target.files[0];
  e.target.value = '';
  if (!file) return;
  try {
    const incoming = JSON.parse(await file.text());
    if (!Array.isArray(incoming) || !incoming.every(n => n.id && 'content' in n)) throw new Error();
    let added = 0, replaced = 0;
    for (const n of incoming) {
      const clean = { id: String(n.id), type: n.type in TYPES ? n.type : 'fleeting', title: String(n.title || ''),
        content: String(n.content), created: Number(n.created) || Date.now(), updated: Number(n.updated) || Date.now() };
      const mine = getNote(clean.id);
      if (!mine) { notes.push(clean); added++; }
      else if (clean.updated > mine.updated) { Object.assign(mine, clean); replaced++; }   // 더 최근 것을 남겨요
    }
    saveNow();
    renderList();
    if (currentId) openNote(currentId);
    toast(`새 메모 ${added}개, 더 최신으로 바뀐 메모 ${replaced}개`);
  } catch {
    toast('⚠️ 메모 상자 백업 파일이 아니에요');
  }
});

let toastTimer;
// 화면 아래 잠깐 뜨는 알림. 버튼(예: 되돌리기)을 붙일 수도 있어요
function toast(msg, actionLabel, onAction) {
  const box = $('toast');
  box.textContent = msg;
  if (actionLabel) {
    const b = document.createElement('button');
    b.textContent = actionLabel;
    b.onclick = () => { box.classList.remove('show'); onAction(); };
    box.appendChild(b);
  }
  box.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => box.classList.remove('show'), actionLabel ? 6000 : 2500);
}

// =====================================================
//  10. 다른 기기와 맞추기 (동기화)
//  실제로 인터넷에 연결하는 일은 맨 아래 Firebase 부분이 해요.
//  여기서는 "무엇이 바뀌었는지" 비교하고, 받은 메모를 합치는 규칙만 정해요.
// =====================================================
const sync = {
  push: null,          // (번호, 메모) → 인터넷 창고에 올리기. 로그인하면 채워져요
  ready: false,        // 인터넷 창고에서 처음 메모를 받아 온 뒤에만 올려요 (오래된 메모로 덮어쓰지 않게)
  key: null,           // 아래 "마지막으로 맞춘 모습"을 저장할 이름표 (계정마다 달라요)
  synced: new Map(),   // 마지막으로 맞춘 모습: 번호 → 메모를 글자로 바꾼 것 (지운 메모는 'deleted')
  login: null, logout: null,
};
const cleanNote = d => ({ id: String(d.id), type: d.type in TYPES ? d.type : 'fleeting', title: String(d.title || ''),
  content: String(d.content || ''), created: Number(d.created) || 0, updated: Number(d.updated) || 0 });

function loadSynced() {
  try { return new Map(JSON.parse(localStorage.getItem(sync.key)) || []); } catch { return new Map(); }
}
function saveSynced() {
  try { if (sync.key) localStorage.setItem(sync.key, JSON.stringify([...sync.synced])); } catch { /* 다음에 다시 저장돼요 */ }
}

// 내 쪽에서 바뀐 메모만 골라서 올리기
function pushChanges() {
  if (!sync.push || !sync.ready) return;
  const mine = new Set();
  for (const n of notes) {
    mine.add(n.id);
    const s = JSON.stringify(cleanNote(n));
    if (sync.synced.get(n.id) !== s) { sync.synced.set(n.id, s); sync.push(n.id, { ...cleanNote(n), deleted: false }); }
  }
  // 내 쪽에서 지운 메모는 "지웠어요" 표시를 올려요 (다른 기기에서도 지워지게)
  for (const [id, s] of sync.synced) {
    if (!mine.has(id) && s !== 'deleted') { sync.synced.set(id, 'deleted'); sync.push(id, { id, deleted: true, updated: Date.now() }); }
  }
  saveSynced();
}

// 다른 기기에서 바뀐 메모 받아서 합치기. 같은 메모를 양쪽에서 고쳤으면 더 최근에 고친 쪽이 남아요
function applyRemote(changes) {
  let touched = false, currentChanged = false;
  for (const { id, data } of changes) {
    const s = data && !data.deleted ? JSON.stringify(cleanNote(data)) : 'deleted';
    if (sync.synced.get(id) === s) continue;   // 이미 알고 있는 모습이에요
    sync.synced.set(id, s);
    const mine = getNote(id);
    if (s === 'deleted') {
      if (mine && (!data || (data.updated || 0) >= mine.updated)) {
        notes = notes.filter(n => n.id !== id);
        touched = true;
        if (id === currentId) currentChanged = true;
      }
    } else {
      const remote = cleanNote(data);
      if (!mine) { notes.push(remote); touched = true; }
      else if (remote.updated >= mine.updated) {
        Object.assign(mine, remote);
        touched = true;
        if (id === currentId) currentChanged = true;
      }
      // 내 것이 더 최신이면 그대로 두고, 곧 다시 올라가요
    }
  }
  saveSynced();
  if (!touched) return pushChanges();   // 내 쪽이 더 최신인 메모가 있으면 바로 올려요
  saveNow();
  renderList();
  if (!currentId) return;
  if (!getNote(currentId)) return closeNote();
  const typing = ['title', 'content'].includes(document.activeElement?.id) || mapEdit;
  if (currentChanged && !typing) openNote(currentId, mode);
  else if (!typing) { renderBacklinks(); if (mode === 'map') renderMap(); else if (mode === 'view') setMode('view'); }
}

// 왼쪽 아래 동기화 상태 표시
function setSyncStatus(state, detail = '') {
  const text = {
    local: '☁️ 동기화 꺼짐 · 이 기기에만 저장돼요',
    signedOut: '☁️ 로그인하면 다른 기기와 맞춰져요',
    connecting: '☁️ 연결 중…',
    synced: `✅ 동기화됨 · ${detail}`,
    pending: '⏳ 올리는 중…',
    offline: '📴 오프라인 · 연결되면 저절로 맞춰져요',
    error: `⚠️ ${detail}`,
  }[state];
  $('syncText').textContent = text;
  $('syncText').title = text;
  const btn = $('syncBtn');
  // 로그인 전에 난 오류면 "다시 시도" 할 수 있게 로그인 버튼을 남겨 둬요
  const loginBtn = state === 'signedOut' || (state === 'error' && !sync.key);
  btn.hidden = !loginBtn && !['synced', 'pending', 'offline'].includes(state);
  btn.textContent = loginBtn ? (state === 'error' ? '다시 로그인' : '구글로 로그인') : '로그아웃';
  btn.onclick = () => (loginBtn ? sync.login : sync.logout)?.();
}

// =====================================================
//  11. 시작!
// =====================================================
saveNow();
renderList();
if (window.innerWidth > 760) openNote(notes.find(n => n.title === '사용법')?.id || notes[0]?.id);
</script>

<script type="module">
// =====================================================
//  12. Firebase 연결
//  Firebase 화면에서 복사한 설정값(apiKey, authDomain ...)을 아래 { } 안에 붙여 넣으면 동기화가 켜져요.
//  비어 있으면 지금처럼 이 기기에만 저장돼요.
// =====================================================
const FIREBASE_CONFIG = {
  apiKey: "AIzaSyCbaelg6M-A0JSv4Fexs8bJblJblx6nDAE",
  authDomain: "zettelkasten-1ee60.firebaseapp.com",
  projectId: "zettelkasten-1ee60",
  storageBucket: "zettelkasten-1ee60.firebasestorage.app",
  messagingSenderId: "782501159895",
  appId: "1:782501159895:web:d4a72668366340e5c86192"
};

const SDK = 'https://www.gstatic.com/firebasejs/10.12.2/';

if (!FIREBASE_CONFIG.apiKey) {
  setSyncStatus('local');
} else {
  try {
    setSyncStatus('connecting');
    const [{ initializeApp }, A, F] = await Promise.all([
      import(SDK + 'firebase-app.js'), import(SDK + 'firebase-auth.js'), import(SDK + 'firebase-firestore.js'),
    ]);
    const app = initializeApp(FIREBASE_CONFIG);
    const auth = A.getAuth(app);
    const db = F.getFirestore(app);
    const explain = e => {
      if (e.code === 'permission-denied') return '권한이 없어요 · Firestore 보안 규칙을 확인해 주세요';
      if (e.code === 'auth/unauthorized-domain') return location.protocol === 'file:'
        ? '파일을 직접 열면 로그인할 수 없어요 · 인터넷 주소(http)로 열어 주세요'
        : `"${location.hostname}"을(를) Firebase 승인된 도메인에 추가해 주세요`;
      if (e.code === 'auth/operation-not-allowed') return 'Firebase에서 Google 로그인을 켜 주세요';
      return e.message || String(e);
    };
    let stopListening = null;

    sync.login = async () => {
      const provider = new A.GoogleAuthProvider();
      try { await A.signInWithPopup(auth, provider); }
      catch (e) {
        if (['auth/popup-blocked', 'auth/operation-not-supported-in-this-environment'].includes(e.code)) await A.signInWithRedirect(auth, provider);
        else if (!['auth/popup-closed-by-user', 'auth/cancelled-popup-request'].includes(e.code)) setSyncStatus('error', explain(e));
      }
    };
    sync.logout = () => A.signOut(auth);

    A.onAuthStateChanged(auth, user => {
      stopListening?.();
      stopListening = null;
      sync.push = null;
      sync.ready = false;
      if (!user) { sync.key = null; sync.synced = new Map(); return setSyncStatus('signedOut'); }

      sync.key = 'memo-box-synced-v1:' + user.uid;
      sync.synced = loadSynced();
      setSyncStatus('connecting');
      // 메모는 users / 내 번호 / notes / 메모 번호 에 한 장씩 저장돼요
      const col = F.collection(db, 'users', user.uid, 'notes');
      sync.push = (id, data) => F.setDoc(F.doc(col, id), data).catch(e => setSyncStatus('error', explain(e)));

      stopListening = F.onSnapshot(col, { includeMetadataChanges: true }, snap => {
        if (snap.metadata.fromCache) return setSyncStatus('offline');
        const changes = snap.docChanges()
          .filter(c => !c.doc.metadata.hasPendingWrites)
          .map(c => ({ id: c.doc.id, data: c.type === 'removed' ? null : c.doc.data() }));
        applyRemote(changes);
        if (!sync.ready) { sync.ready = true; pushChanges(); }   // 처음 받아 온 뒤, 내 쪽에만 있는 메모 올리기
        setSyncStatus(snap.metadata.hasPendingWrites ? 'pending' : 'synced', user.email);
      }, e => setSyncStatus('error', explain(e)));
    });
  } catch (e) {
    setSyncStatus('error', '동기화 연결 실패 · 이 기기에만 저장돼요');
    console.error(e);
  }
}
</script>
